<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.3 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.45 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 1.5px dashed var(--text-3); border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
.clist { list-style: none; padding: 0; margin: 4px 0 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; font-size: 12px; }
.clist li { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; color: var(--text-2); line-height: 1.5; }
.clist li b { color: var(--text); font-weight: 600; display: block; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; line-height: 1.6; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Jezik / Language"><button data-lang="bs">BS</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Tema / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'bs';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'bs') LANG = q; else { const s = localStorage.getItem('ba-viz-lang'); if (s === 'en' || s === 'bs') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('ba-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ strings
const NB = ' ';
const S = {
bs: {
  title: 'Pravo Bosne i Hercegovine u 20 grafikona',
  lede: 'Dvadeset grafikona nacrtanih samo iz podataka ovog repozitorija: svaki akt iz popisa brojeva Službenog glasnika BiH od 1997., propisi čiji je tekst ovdje, Ustav, odluke visokog predstavnika, prijedlozi zakona koji nisu usvojeni, baza odluka Ustavnog suda i predmeti Suda Bosne i Hercegovine.',
  profile_h: 'Profil podataka: šta je korišteno i koliko je potpuno',
  tbl: 'Tabela s podacima', src: 'Izvor u repozitoriju', n: 'Zapisa', cover: 'Obuhvat', caveat: 'Ograničenje',
  ds: 'Skup podataka', foot: 'Napravljeno iz repozitorija lexifina/bosnia-and-herzegovina-law ({built}). Brojeve računa skripta visualisations/src/prep.py iz git historije, iz foldera propisa i iz tabela u registry/data/; stranicu sastavlja build.py. Svi grafikoni su opisni: pokazuju šta izvori bilježe, a ne zašto.',
  year: 'Godina', total: 'Ukupno', share: 'Udio', partial: 'nepotpuna godina', days: 'dana',
  gl: 'Grafikoni o pravu svih zemalja, iz cijelog global-law-a: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Ovdje su samo grafikoni o Bosni i Hercegovini.',
},
en: {
  title: 'The law of Bosnia and Herzegovina in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: every act in the issue lists of Službeni glasnik BiH since 1997, the acts whose text is here, the Constitution, the High Representative\'s decisions, the bills that were not adopted, the Constitutional Court\'s database of decisions and the cases of the Court of Bosnia and Herzegovina.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/bosnia-and-herzegovina-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history, the act folders and the tables in registry/data/; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  year: 'Year', total: 'Total', share: 'Share', partial: 'partial year', days: 'days',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Bosnia and Herzegovina alone.',
}};
const t = k => S[LANG][k];
const L = (bs, en) => LANG === 'bs' ? bs : en;
const LA = a => a ? (LANG === 'bs' ? a[0] : a[1]) : '';
const fmt = n => { if (n == null || isNaN(n)) return '–'; const s = String(Math.round(Math.abs(+n))).replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'bs' ? '.' : ','); return (+n < 0 ? '−' : '') + s; };
const dec = (v, d = 1) => { const s = (+v).toFixed(d); return LANG === 'bs' ? s.replace('.', ',') : s; };
const pv = v => (LANG === 'bs' ? dec(v, 0) + NB + '%' : dec(v, 0) + '%');
const pct = (a, b, d = 0) => b ? (LANG === 'bs' ? dec(100 * a / b, d) + NB + '%' : dec(100 * a / b, d) + '%') : '–';
const km = v => LANG === 'bs' ? dec(v, 2) + NB + 'KM' : 'KM' + NB + dec(v, 2);
// Bosnian plural forms: 1, 21… one; 2–4, 22–24… few; the rest many
const pl = (n, one, few, many) => { const a = Math.abs(Math.round(n)) % 100, b = a % 10; return (b === 1 && a !== 11) ? one : (b >= 2 && b <= 4 && (a < 12 || a > 14)) ? few : many; };
const W_BS = { akt: ['akt', 'akta', 'akata'], zakon: ['zakon', 'zakona', 'zakona'], odluka: ['odluka', 'odluke', 'odluka'], dan: ['dan', 'dana', 'dana'], godina: ['godina', 'godine', 'godina'],
  predmet: ['predmet', 'predmeta', 'predmeta'], prijedlog: ['prijedlog', 'prijedloga', 'prijedloga'], propis: ['propis', 'propisa', 'propisa'], put: ['put', 'puta', 'puta'],
  rjesenje: ['rješenje', 'rješenja', 'rješenja'], imenovanje: ['imenovanje', 'imenovanja', 'imenovanja'], izmjena: ['izmjena', 'izmjene', 'izmjena'], broj: ['broj', 'broja', 'brojeva'],
  mjesec: ['mjesec', 'mjeseca', 'mjeseci'], sudija: ['sudija', 'sudije', 'sudija'], tuzilac: ['tužilac', 'tužioca', 'tužilaca'] };
const nw = (n, w) => fmt(n) + NB + pl(n, ...W_BS[w]);
const MGEN = ['januara', 'februara', 'marta', 'aprila', 'maja', 'juna', 'jula', 'augusta', 'septembra', 'oktobra', 'novembra', 'decembra'];
const MEN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MBS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const dateTxt = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return LANG === 'bs' ? `${d}. ${MGEN[m - 1]} ${y}.` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return LANG === 'bs' ? `${d}. ${m}. ${y}.` : `${d} ${MEN[m - 1]} ${y}`; };
const yr = y => LANG === 'bs' ? `${y}.` : String(y);
const yrs = (a, b) => LANG === 'bs' ? `${a}–${b}.` : `${a}–${b}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const mix = (a, b, k) => d3.interpolateRgb(a, b)(k);
// a title from the Gazette's issue list (upper case) in sentence case, with the proper names it most often contains restored
const PROPER = [[/\bbosne i hercegovine\b/g, 'Bosne i Hercegovine'], [/\bbosni i hercegovini\b/g, 'Bosni i Hercegovini'], [/\bbosnu i hercegovinu\b/g, 'Bosnu i Hercegovinu'],
  [/\bbosna i hercegovina\b/g, 'Bosna i Hercegovina'], [/\bbih\b/g, 'BiH'], [/\brepublike srpske\b/g, 'Republike Srpske'], [/\brepublika srpska\b/g, 'Republika Srpska'],
  [/\bfederacije\b/g, 'Federacije'], [/\bbrčko distrikt/g, 'Brčko distrikt'], [/\bvisok(og|i|om) predstavnik/g, (m) => m], [/\bustavnog suda\b/g, 'Ustavnog suda'],
  [/\bsuda bosne\b/g, 'Suda Bosne'], [/\bsud bosne\b/g, 'Sud Bosne'], [/\bsrebrenica\b/g, 'Srebrenica'], [/\bpotočari\b/g, 'Potočari'], [/\bmostar/g, 'Mostar'], [/\bsdp\b/g, 'SDP'],
  [/\bsds\b/g, 'SDS'], [/\bhdz\b/g, 'HDZ'], [/\bsnsd\b/g, 'SNSD'], [/\brtv\b/g, 'RTV'], [/\b(službeni glasnik|"službeni glasnik)/g, (m) => m.replace('službeni', 'Službeni')]];
const nice = s => { if (!s) return ''; let x = s.trim().toLowerCase(); PROPER.forEach(([re, to]) => { x = x.replace(re, to); }); x = x.replace(/^odluku\b/, 'odluka').replace(/^naredbu\b/, 'naredba').replace(/^uputu\b/, 'uputa'); return x.charAt(0).toUpperCase() + x.slice(1); };

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); const i = s.append('i').attr('class', it.shape || ''); if (['dash', 'ring', 'outline'].includes(it.shape)) i.style('border-color', it.c); else if (it.shape !== 'hatch') i.style('background', it.c); s.append('span').text(it.l); });
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }

const LASTY = +PF.gazette_to.slice(0, 4);

part('p1', 'I. Službeni glasnik BiH, 1997–2026.', 'I. The Official Gazette, 1997–2026',

  'Every act in the issue lists of Službeni glasnik BiH, from the first issue of 29 October 1997. From 2010 the lists leave out the acts whose text is in the repository, so those are added from the act folders.');

chart('c01', el => {
  const rows = D.c01.rows, cols = S8(), keys = ['law', 'reg', 'dec', 'rul', 'court', 'oth'];

          `the kind is read from the first word of the title (rules in src/prep.py); decisions of the Constitutional Court and other courts are grouped by their issuer. 1997 starts on 29 October and 2026 ends on ${dateTxt(PF.gazette_to)} (lighter). Later consolidated texts of the same act are not counted separately.`));

chart('c02', el => {
  const raw = D.c02.rows, merge = ['other', 'unknown', 'court'];
  const rows = raw.filter(r => !merge.includes(r.k)).sort((a, b) => b.n - a.n);
  const oth = { k: 'other', n: 0, by: {}, first: 9999 };
  raw.filter(r => merge.includes(r.k)).forEach(r => { oth.n += r.n; oth.first = Math.min(oth.first, r.first); Object.entries(r.by).forEach(([y, n]) => oth.by[y] = (oth.by[y] || 0) + n); });
  rows.push(oth);
  const YRS = d3.range(1997, LASTY + 1), N = sum(rows, r => r.n), com = rows.find(r => r.k === 'com'), hj = rows.find(r => r.k === 'hjpc');
  const uio = rows.find(r => r.k === 'uio'), kv = rows.find(r => r.k === 'kv');
  const firstBig = r => +Object.entries(r.by).find(([, n]) => n >= 10)[0];
  return {
    title: L(`Ko objavljuje u Glasniku: Vijeće ministara ${nw(com.n, 'akt')}, Visoko sudsko i tužilačko vijeće ${fmt(hj.n)}`, `Who publishes in the Gazette: the Council of Ministers ${fmt(com.n)} acts, the High Judicial and Prosecutorial Council ${fmt(hj.n)}`),
    dek: L(`Svaki red je jedan donosilac, svako polje jedna godina: što je tamnije, to je više akata. Državne institucije se pojavljuju jedna za drugom: Visoko sudsko i tužilačko vijeće redovno od ${yr(firstBig(hj))}, Uprava za indirektno oporezivanje od ${yr(uio.first)}, Konkurencijsko vijeće od ${yr(kv.first)}. Desno je ukupan broj akata.`,
      `Each row is one issuer, each cell one year: the darker, the more acts. State institutions appear one after another: the High Judicial and Prosecutorial Council regularly from ${firstBig(hj)}, the Indirect Taxation Authority from ${uio.first}, the Competition Council from ${kv.first}. On the right, the total.`),
    draw(el) {
      const w = W(el), nw_ = narrow(w), labs = rows.map(r => LA(ISS[r.k]));
      const totW = nw_ ? 0 : 92, lw = nw_ ? 0 : Math.ceil(textW(el, labs)) + 12, up = nw_;
      const rowH = up ? 36 : 22, m = { t: 22, r: 8, b: 6, l: lw };
      const iw = w - m.l - m.r - totW - (nw_ ? 0 : 12), cw = iw / YRS.length, h = m.t + m.b + rowH * rows.length;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const mx = d3.max(rows, r => d3.max(Object.values(r.by))), ramp = seqRamp(), col = n => ramp(0.12 + 0.88 * Math.sqrt(n / mx));
      YRS.forEach((y, j) => { if (y % 5 === 0 || y === 1997) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(nw_ ? `’${String(y).slice(2)}` : y); });
      const xb = d3.scaleLinear().domain([0, d3.max(rows, r => r.n)]).range([0, totW - 44]);
      rows.forEach((r, i) => {
        const cy = i * rowH, ry = up ? cy + 15 : cy;
        if (up) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy + 11).text(`${labs[i]} · ${fmt(r.n)}`);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(labs[i]);
        YRS.forEach((y, j) => {
          const n = r.by[y] || 0;
          bindTip(g.append('rect').attr('x', j * cw + 0.75).attr('y', ry + 2).attr('width', Math.max(1, cw - 1.5)).attr('height', (up ? 18 : rowH) - 4).attr('rx', Math.min(3, cw / 3))
            .attr('fill', n ? col(n) : css('--surface-2')).attr('opacity', (y === 1997 || y === LASTY) && n ? .6 : 1).datum({ r, y, n }),
            d => `<b>${esc(labs[i])} · ${yr(d.y)}</b>` + trow(null, L('Akata', 'Acts'), fmt(d.n)));
        });
        if (!nw_) {
          g.append('path').attr('d', barPath(iw + 12, cy + 6, iw + 12 + Math.max(1, xb(r.n)), rowH - 12, 2)).attr('fill', r.k === 'other' ? css('--muted-mark') : css('--s1'));
          g.append('text').attr('class', 'lbl').attr('x', iw + 18 + xb(r.n)).attr('y', cy + 15).text(fmt(r.n));
        }
      });
      note(el, ['sluzbeni-glasnik/**/README.md (Donosilac)', '<vrsta>/<godina>/sg<broj>-<id>/uvod.md, tekst.md'], fmt(N) + L(' akata', ' acts'),
        L(`donosilac je onaj koga navodi popis broja; za propise čiji je tekst ovdje (od 2010.) čita se iz uvodne rečenice teksta (onaj ko „donosi” ili „je donio”), a ${fmt(D.c02.text_unknown)} od ${fmt(D.c02.text_n)} takvih propisa nije bilo moguće pripisati. Agencije, uprave, uredi i komisije su jedan red; Centralna izborna komisija uključuje i Privremenu izbornu komisiju OSCE-a (1997–2001). „Ostali” obuhvataju i sudove osim Ustavnog suda.`,
          `the issuer is the one the issue list names; for acts whose text is here (from 2010) it is read from the enacting sentence of the text (whoever "donosi" or "je donio"), and ${fmt(D.c02.text_unknown)} of ${fmt(D.c02.text_n)} such acts could not be attributed. Agencies, administrations, offices and commissions are one row; the Central Election Commission includes the OSCE's Provisional Election Commission (1997–2001). "Other" includes courts other than the Constitutional Court.`));
      table(el, [L('Donosilac', 'Issuer'), ...YRS.map(String), t('total')], rows.map(r => [LA(ISS[r.k]), ...YRS.map(y => r.by[y] || 0), r.n]));
    }
  };
});

chart('c04', el => {

part('p2', 'II. Dejtonski ustav i visoki predstavnik', 'II. The Dayton Constitution and the High Representative',

chart('c05', el => {
  const P = D.c05.parts, keys = ['entity', 'fbih', 'rs', 'bosniac', 'croat', 'serb', 'others', 'citizen'];
  const tot = k => sum(P, p => p[k]), peoples = tot('bosniac') + tot('croat') + tot('serb'), a4 = P.find(p => p.p === 'art-04'), a5 = P.find(p => p.p === 'art-05');
  const words = sum(P, p => p.words);
  return {
    title: L(`Ustav (Aneks 4): entiteti se spominju ${nw(tot('entity'), 'put')}, konstitutivni narodi ${nw(peoples, 'put')}, Ostali ${tot('others') === 1 ? 'jednom' : nw(tot('others'), 'put')}`,
      `The Constitution (Annex 4): the Entities are named ${fmt(tot('entity'))} times, the constituent peoples ${fmt(peoples)} times, Others ${tot('others') === 1 ? 'once' : fmt(tot('others')) + ' times'}`),
    dek: L(`Koliko puta svaki dio Ustava imenuje entitete, konstitutivne narode i građane. Bošnjake, Hrvate i Srbe imenuju prije svega član IV. o Parlamentarnoj skupštini (${fmt(a4.bosniac + a4.croat + a4.serb)} puta) i član V. o Predsjedništvu (${fmt(a5.bosniac + a5.croat + a5.serb)}); „Ostale” samo preambula. Stupci gore su dužina svakog dijela u riječima, ukupno ${fmt(words)}.`,
      `How often each part of the Constitution names the Entities, the constituent peoples and citizens. Bosniacs, Croats and Serbs are named above all in Article IV on the Parliamentary Assembly (${fmt(a4.bosniac + a4.croat + a4.serb)} times) and Article V on the Presidency (${fmt(a5.bosniac + a5.croat + a5.serb)}); "Others" only in the preamble. The columns on top are the length of each part in words, ${fmt(words)} in all.`),
    draw(el) {
      const w = W(el), nw_ = narrow(w), labs = keys.map(k => LA(TERM5[k])), up = nw_;
      const lw = up ? 0 : Math.ceil(textW(el, labs)) + 12, rw = nw_ ? 24 : 46, topH = nw_ ? 54 : 70, rowH = nw_ ? 36 : 28, cellH = nw_ ? 20 : 28;
      const m = { t: topH + 22, r: rw, b: 8, l: lw }, iw = w - m.l - m.r, cw = iw / P.length, h = m.t + m.b + rowH * keys.length;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const mx = d3.max(P, p => d3.max(keys, k => p[k])), ramp = seqRamp(), col = n => ramp(0.15 + 0.85 * Math.sqrt(n / mx));
      const yw = d3.scaleLinear().domain([0, d3.max(P, p => p.words)]).range([0, topH - 16]);
      P.forEach((p, j) => {
        const x0 = j * cw, hh = yw(p.words);
        g.append('path').attr('d', colPath(x0 + cw * .18, -22, cw * .64, -22 - hh, 3)).attr('fill', p.p === 'art-04' || p.p === 'art-05' ? css('--s2') : css('--muted-mark'));
        if (!nw_ || p.words === d3.max(P, q => q.words)) g.append('text').attr('class', 'lbl mut').attr('x', x0 + cw / 2).attr('y', -26 - hh).attr('text-anchor', 'middle').text(fmt(p.words));
        const colLab = nw_ ? (p.p === 'preamble' ? 'P' : p.p === 'annex-i' ? 'A1' : p.p === 'annex-ii' ? 'A2' : String(+p.p.slice(4))) : PARTN[p.p][2];
        g.append('text').attr('class', 'lbl strong').attr('x', x0 + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(colLab);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0).attr('width', cw).attr('y', -m.t).attr('height', h).datum(p),
          d => `<b>${esc(LA(PARTN[d.p]))}</b>` + trow(null, L('Riječi', 'Words'), fmt(d.words)) + keys.map(k => d[k] ? trow(null, LA(TERM5[k]), fmt(d[k])) : '').join(''));
      });
      keys.forEach((k, i) => {
        const cy = i * rowH, ry = up ? cy + 14 : cy;
        if (up) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy + 10).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        P.forEach((p, j) => {
          const n = p[k];
          g.append('rect').attr('x', j * cw + 1).attr('y', ry + 2).attr('width', cw - 2).attr('height', cellH - 4).attr('rx', nw_ ? 3 : 4).attr('fill', n ? col(n) : css('--surface-2')).style('pointer-events', 'none');

// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {

    spec.title = stops(spec.title); spec.dek = stops(spec.dek);

if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
