part('p4', 'IV. Ustavni sud', 'IV. The Constitutional Court',

chart('c15', el => {

       [fmt(lastY), L(`u ${LASTY}. godini`, `in ${LASTY}`), L(`do ${dateShort(PF.gazette_to)}`, `to ${dateShort(PF.gazette_to)}`)]].forEach(([v, a, b]) => {
        const d = cards.append('div').attr('class', 'ptile'); d.append('div').attr('class', 'pv').html(`<b>${v}</b> ${esc(a)}`); d.append('div').attr('class', 'ps').text(b); });
      const w = W(el), nw_ = narrow(w), Y = d3.range(+R[0].d.slice(0, 4), LASTY + 1), maxN = d3.max(Y, y => byY.get(y) || 0);
      const step = nw_ ? 6 : 8, rr = nw_ ? 2.5 : 3.3, m = { t: 10, r: 8, b: 24, l: 8 }, ih = maxN * step + 8, h = m.t + m.b + ih;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);

        L(`vrsta odluke „Rješenje o neizvršenju” iz baze Suda; godina je datum rješenja. Za neke predmete Sud je donio i više takvih rješenja. ${yr(LASTY)} je nepotpuna.`,

      table(el, [L('Datum', 'Date'), L('Predmet', 'Case'), L('Podnesen', 'Filed')], R.map(r => [r.d, `${r.ty}-${r.no}/${String(r.cy).slice(2)}`, String(r.cy)]));

chart('c19', el => {

      `For cases that ended in a final decision: the median days from the confirmation of the indictment to the final conclusion, by year of indictment. War crimes cases (solid line) take longer than Section II cases (dashed)${allLonger ? ' in every year' : ''}, ${dec(X.s1.med / X.s2.med, 1)} times as long overall; the gap is shaded.`),
    draw(el) {
      const c1 = cols[7], c2 = cols[0];
      legend(el, [{ c: c1, l: LA(SEC.s1), shape: 'line' }, { c: c2, l: LA(SEC.s2), shape: 'dash' }]);
      const w = W(el), nw_ = narrow(w), h = 320, m = { t: 18, r: nw_ ? 64 : 120, b: 26, l: 46 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const Y0 = d3.min(R, r => r.y), Y1 = d3.max(R, r => r.y);
      const x = d3.scaleLinear().domain([Y0, Y1]).range([0, iw]), y = d3.scaleLinear().domain([0, d3.max(R.filter(r => r.n >= 3), r => r.med) * 1.12]).nice().range([ih, 0]);
      yAxis(g, y, iw, 5, v => L(`${fmt(v)}`, `${fmt(v)}`));
      g.append('text').attr('class', 'lbl mut').attr('x', -40).attr('y', -6).text(L('dana', 'days'));
      d3.range(Y0, Y1 + 1, nw_ ? 4 : 2).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      // gap between the two lines over the years both have
      const both = s1.filter(a => s2.find(b => b.y === a.y));
      if (both.length > 1) g.append('path').attr('d', d3.area().x(r => x(r.y)).y0(r => y(s2.find(b => b.y === r.y).med)).y1(r => y(r.med))(both)).attr('fill', c1).attr('fill-opacity', .1);
      g.append('path').attr('d', d3.line().x(r => x(r.y)).y(r => y(r.med))(s2)).attr('fill', 'none').attr('stroke', c2).attr('stroke-width', 2).attr('stroke-dasharray', '5 4');
      g.append('path').attr('d', d3.line().x(r => x(r.y)).y(r => y(r.med))(s1)).attr('fill', 'none').attr('stroke', c1).attr('stroke-width', 2.4);
      [[s1, c1], [s2, c2]].forEach(([S_, c]) => S_.forEach(r => g.append('circle').attr('cx', x(r.y)).attr('cy', y(r.med)).attr('r', r.open ? 3.6 : 3).attr('fill', r.open >= 3 ? css('--surface') : c).attr('stroke', c).attr('stroke-width', 1.6)));
      // labels where they touch no line, point or other label
      const obs = { segs: [...segsOf(s1.map(r => [x(r.y), y(r.med)])), ...segsOf(s2.map(r => [x(r.y), y(r.med)]))], pts: [...s1, ...s2].map(r => [x(r.y), y(r.med), 4]), boxes: [] };
      const bounds = [-m.l + 2, -m.t, iw + m.r - 2, ih], dd = v => L(`${fmt(v)} dana`, `${fmt(v)} days`);
      const pk = s1.reduce((a, b) => b.med > a.med ? b : a);
      placeLabel(el, g, [[x(pk.y), y(pk.med) - 10, 'middle'], [x(pk.y) + 8, y(pk.med) - 4, 'start']], L(`${fmt(pk.med)} dana (${pk.y}.)`, `${fmt(pk.med)} days (${pk.y})`), obs, 'lbl mut', null, bounds);
      [[s1, c1], [s2, c2]].forEach(([S_, c]) => { const a = S_[0], z = S_[S_.length - 1], ax = x(a.y), ay = y(a.med), zx = x(z.y), zy = y(z.med);
        placeLabel(el, g, [[zx + 8, zy + 4, 'start'], [zx + 8, zy - 6, 'start'], [zx + 8, zy + 14, 'start']], dd(z.med), obs, 'lbl strong', c, bounds);
        placeLabel(el, g, [[ax - 6, ay + 4, 'end'], [ax + 6, ay - 9, 'start'], [ax + 6, ay + 16, 'start'], [ax, ay - 12, 'middle'], [ax, ay + 20, 'middle']], dd(a.med), obs, 'lbl strong', c, bounds); });
      bindTip(g.selectAll('rect.hit').data(d3.range(Y0, Y1 + 1)).join('rect').attr('class', 'hit').attr('x', yy => x(yy) - iw / (Y1 - Y0) / 2).attr('width', iw / (Y1 - Y0)).attr('y', 0).attr('height', ih),
        yy => { const a = R.find(r => r.s === 's1' && r.y === yy), b = R.find(r => r.s === 's2' && r.y === yy);
          return `<b>${L('Optužnice iz', 'Indictments of')} ${yr(yy)}</b>` + (a ? trow(c1, LA(SEC.s1), `${fmt(a.med)} ${t('days')} · n = ${a.n}${a.open ? L(` · još u toku ${a.open}`, ` · ${a.open} still open`) : ''}`) : '') +
            (b ? trow(c2, LA(SEC.s2), `${fmt(b.med)} ${t('days')} · n = ${b.n}${b.open ? L(` · još u toku ${b.open}`, ` · ${b.open} still open`) : ''}`) : ''); });
      note(el, ['sudska-praksa/sud-bih/<godina>/<predmet>/README.md (Datum potvrđivanja optužnice, Predmet pravosnažno okončan)'], fmt(X.s1.n + X.s2.n) + L(' završenih predmeta', ' closed cases'),
        L('samo predmeti s datumom pravosnažnog okončanja; godine s manje od tri takva predmeta nisu nacrtane. Prazan krug: u toj godini optužnice tri ili više predmeta je još u toku, pa medijan za nju može porasti. Predmeti u toku nisu u medijanu, pa novije godine izgledaju brže nego što će biti.',
          'only cases with a date of final conclusion; years with fewer than three such cases are not drawn. Hollow circle: three or more cases indicted that year are still open, so its median may rise. Open cases are not in the median, so recent years look faster than they will be.'));
      table(el, [L('Godina optužnice', 'Year indicted'), L('Odjel', 'Section'), L('Završenih', 'Closed'), L('Medijan dana', 'Median days'), L('U toku', 'Open')], R.map(r => [String(r.y), LA(SEC[r.s]), r.n, r.med, r.open]));
    }
  };
});

chart('c20', el => {
  const R = D.c20.filter(r => r.y >= 2004), cols = S8(), sys = ['fbih', 'rs', 'state', 'bd'];
  const v = (r, s, j) => r[s + '_' + j] || 0, T = s => sum(R, r => v(r, s, 'judge') + v(r, s, 'pros')), N = sum(sys, T) + sum(R, r => v(r, 'other', 'judge') + v(r, 'other', 'pros'));
  return {
    title: L(`Jedno vijeće imenuje sudije i tužioce cijele zemlje: ${nw(N, 'imenovanje')} od ${yr(2004)}, ${pct(T('fbih'), N)} u Federaciji BiH`,
      `One council appoints the judges and prosecutors of the whole country: ${fmt(N)} appointments since 2004, ${pct(T('fbih'), N)} in the Federation of BiH`),
    dek: L(`Odluke Visokog sudskog i tužilačkog vijeća o imenovanju sudija i tužilaca objavljene u Glasniku, po godini i po tome gdje je sud ili tužilaštvo: u Federaciji BiH, Republici Srpskoj, na državnom nivou ili u Brčko distriktu. Puni dio stupca su sudije, blijeđi tužioci.`,
      `The High Judicial and Prosecutorial Council's decisions appointing judges and prosecutors, published in the Gazette, by year and by where the court or prosecutor's office is: in the Federation of BiH, Republika Srpska, at state level or in Brčko District. The solid part of a column is judges, the paler part prosecutors.`),
    draw(el) {
      const cj = cols[0], cp = mix(cols[0], css('--surface'), .55);
      legend(el, [{ c: cj, l: L('Sudije', 'Judges') }, { c: cp, l: L('Tužioci', 'Prosecutors') }]);
      const box = el.append('div').attr('class', 'multi'), panes = sys.map(() => box.append('div'));
      const ymax = d3.max(R, r => d3.max(sys, s => v(r, s, 'judge') + v(r, s, 'pros')));
      sys.forEach((s, pi) => {
        const p = panes[pi], tj = sum(R, r => v(r, s, 'judge')), tp = sum(R, r => v(r, s, 'pros'));
        p.append('h4').text(`${LA(SYS[s])} · ${fmt(tj + tp)}`);
        p.append('p').text(L(`${nw(tj, 'sudija')} · ${nw(tp, 'tuzilac')}`, `${fmt(tj)} judges · ${fmt(tp)} prosecutors`));
        const w = W(p), h = 170, m = { t: 8, r: 4, b: 22, l: 30 };
        const svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b;
        const x = d3.scaleBand().domain(R.map(r => r.y)).range([0, iw]).padding(.18), y = d3.scaleLinear().domain([0, ymax]).nice().range([ih, 0]);
        yAxis(g, y, iw, 3);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        R.forEach(r => { const j = v(r, s, 'judge'), q = v(r, s, 'pros'), x0 = x(r.y), bw = x.bandwidth(), op = r.y === LASTY ? .55 : 1;
          if (j) g.append('path').attr('d', q ? `M${x0},${ih}V${y(j)}H${x0 + bw}V${ih}Z` : colPath(x0, ih, bw, y(j), 2)).attr('fill', cj).attr('opacity', op);
          if (q) g.append('path').attr('d', colPath(x0, y(j) - (j ? 1 : 0), bw, y(j + q), 2)).attr('fill', cp).attr('opacity', op);
          if (r.y % 4 === 0) g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(`’${String(r.y).slice(2)}`);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0).attr('width', bw).attr('y', 0).attr('height', ih).datum(r), d => `<b>${LA(SYS[s])} · ${yr(d.y)}</b>` + trow(cj, L('Sudije', 'Judges'), fmt(v(d, s, 'judge'))) + trow(cp, L('Tužioci', 'Prosecutors'), fmt(v(d, s, 'pros')))); });
      });
      const oth = sum(R, r => v(r, 'other', 'judge') + v(r, 'other', 'pros'));
      note(el, ['sluzbeni-glasnik/**/README.md (Donosilac: Visoko sudsko i tužilačko vijeće; ODLUKU O IMENOVANJU …)'], fmt(N) + L(' imenovanja', ' appointments'),
        L(`odluka se broji ako je naslov o imenovanju (bez poništenja, izmjena, razrješenja i imenovanja u Vijeće i njegov sekretarijat); sistem se čita iz naziva suda ili tužilaštva (općinski i kantonalni = Federacija, osnovni i okružni = Republika Srpska, Sud i Tužilaštvo BiH = državni nivo; pravila u src/prep.py). ${fmt(oth)} odluka bez naziva suda u naslovu je samo u ukupnom broju. Jedna odluka može imenovati više osoba. ${yr(LASTY)} je nepotpuna.`,
          `a decision counts if its title is an appointment (annulments, amendments, dismissals and appointments to the Council and its secretariat left out); the system is read from the name of the court or prosecutor's office (municipal and cantonal = Federation, basic and district = Republika Srpska, the Court and Prosecutor's Office of BiH = state level; rules in src/prep.py). ${fmt(oth)} decisions with no court named in the title are only in the total. One decision may appoint several people. ${LASTY} is partial.`));
      table(el, [t('year'), ...sys.flatMap(s => [LA(SYS[s]) + L(': sudije', ': judges'), L('tužioci', 'prosecutors')]), L('Nije navedeno', 'Not stated')], R.map(r => [String(r.y), ...sys.flatMap(s => [v(r, s, 'judge'), v(r, s, 'pros')]), v(r, 'other', 'judge') + v(r, 'other', 'pros')]));
    }
  };
});

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Popis akata Službenog glasnika BiH', 'Issue lists of Službeni glasnik BiH'), 'sluzbeni-glasnik/<godina>/<broj>/<akt>/README.md', fmt(P.sg_index), L(`${dateTxt(P.gazette_from)} – ${dateTxt(P.gazette_to)}; naslov, donosilac, broj i datum`, `${dateTxt(P.gazette_from)} – ${dateTxt(P.gazette_to)}; title, issuer, issue and date`), L('od 2010. bez propisa čiji je tekst ovdje (dodani su iz foldera propisa); neki naslovi su skraćeni', 'from 2010 without the acts whose text is here (added from the act folders); some titles are cut short')],
    [L('Propisi s tekstom', 'Acts with text'), '<vrsta>/<godina>/sg<broj>-<id>/', fmt(P.acts_text), L('2010–2026; zakoni, pravilnici, uputstva, odluke, naredbe i drugi', '2010–2026; laws, rulebooks, instructions, decisions, orders and others'), L('kasnije izmjene nisu unesene u tekst, osim službenih prečišćenih tekstova', 'later amendments are not written into the text, except official consolidated texts')],
    [L('Registar propisa', 'Registry of acts'), 'registry/data/acts.json', fmt(P.registry_acts), L('status, verzije, propisi koji mijenjaju', 'status, versions, amending acts'), L('pet vrsta propisa, bez odluka', 'five kinds of acts, no decisions')],
    [L('Ustav', 'Constitution'), 'constitution/', '15', L('preambula, 12 članova, 2 aneksa', 'preamble, 12 articles, 2 annexes'), L('engleski tekst iz 1995., bez Amandmana I', 'English text of 1995, without Amendment I')],
    [L('Odluke Ustavnog suda', 'Constitutional Court decisions'), 'caselaw/ustavni-sud/', fmt(P.cc_decisions), '1997–2026', L('podaci iz baze Suda; tekst samo za dio odluka', 'data from the Court\'s database; text for only some decisions')],
    [L('Prijedlozi zakona', 'Bills'), 'bill/', fmt(P.bills), '2004–2015', L('samo prijedlozi koji nisu postali zakon', 'only bills that did not become law')],
    [L('Predmeti Suda BiH', 'Court of BiH cases'), 'sudska-praksa/sud-bih/', fmt(P.sud_cases), L('optužnice 2003–2022', 'indictments 2003–2022'), L('stranice Suda, ne potpun spisak; bez imena', 'the Court\'s pages, not a complete list; no names')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[PF.gazette_items, L('akata u Službenom glasniku BiH od 1997.', 'acts in Službeni glasnik BiH since 1997')], [PF.acts_text, L('propisa s tekstom (od 2010.)', 'acts with text (since 2010)')],
    [PF.ohr, L('akata visokog predstavnika', 'acts of the High Representative')], [PF.cc_decisions, L('odluka Ustavnog suda', 'Constitutional Court decisions')],
    [PF.sud_cases, L('predmeta Suda BiH', 'Court of BiH cases')], [PF.bills, L('prijedloga zakona koji nisu usvojeni', 'bills that were not adopted')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${fmt(d[0])}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.bs, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dbs, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.bs, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    spec.title = stops(spec.title); spec.dek = stops(spec.dek);
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('ba-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('ba-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
